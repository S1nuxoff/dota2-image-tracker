name: Download Dota Images

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Convert all images again, not only new and changed ones"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  VRF_VERSION: "20.1"

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Download Source2Viewer ${{ env.VRF_VERSION }}
        run: |
          curl -sSL -o vrf.zip "https://github.com/ValveResourceFormat/ValveResourceFormat/releases/download/${VRF_VERSION}/cli-linux-x64.zip"
          unzip -q vrf.zip -d vrf
          chmod +x vrf/Source2Viewer-CLI
          rm vrf.zip
      - name: Run script
        run: node index.js '${{ secrets.USERNAME }}' '${{ secrets.PASSWORD }}' ${{ inputs.force && '--force' || '' }}
      - name: Read manifest ID
        run: echo "MANIFEST_ID=$(cat static/manifestId.txt)" >> $GITHUB_ENV
      - name: Commit & push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "manifest ${{ env.MANIFEST_ID }}"
